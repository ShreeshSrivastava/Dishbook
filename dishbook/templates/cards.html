<ul class="recipe-list">
  {% for recipe in recipes %}
    <li>
      <article class="recipe-card">
        <a class="card__link" href="/recipe/{{ recipe.id }}">
          <figure class="card__media">
            {% if recipe.photo %}
              <img src="{% url 'recipe_photo' recipe.id %}" alt="Photo of {{ recipe.title }}" width="640" height="640" loading="lazy" />
            {% endif %}
          </figure>
          <div class="card__body">
            <h3 class="card__title">{{ recipe.title }}</h3>
            <ul class="tags">
              {% for tag in recipe.sorted_tags %}
                <li><a href="/s?q=tag:{{ tag.name }}">#{{ tag.name }}</a></li>
              {% endfor %}
            </ul>
          </div>
        </a>
      </article>
    </li>
  {% endfor %}
</ul>
