<!doctype html>
<html lang="en">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital@0;1&family=Playwrite+US+Trad:wght@100..400&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dishbook — Home</title>
  <!-- Skeleton only. Wire your template + CSS later. -->
  <link rel="stylesheet" href="/static/main.css" />
</head>
<body>
  <!-- Site Header / Nav -->
  <header class="site-header" role="banner">
    <div class="site-header__inner">
      <a class="brand" href="/">Dishbook</a>
              <p> Ben Braiser <a href="/static/profile.html">View profile</a></p>

      <nav class="site-nav" aria-label="Primary">
        <ul class="site-nav__links">
          <li><a href="/" aria-current="page">Home</a></li>
          <li><a href="/cookbook">My Cookbook</a></li>
        </ul>
        <form class="site-nav__search" role="search" action="/search" method="get">
          <input id="q" name="q" type="search" placeholder="" />
          <button type="submit">Search</button>
        </form>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- Search controls -->
    <section class="search" aria-labelledby="search-heading">
      <div class="search__inner">
        <h1 id="search-heading">Search recipes</h1>
        <form class="search-form" role="search" action="/search" method="get">
          <div class="search-form__row">
            <input id="q" name="q" type="search" required placeholder="" />
            <button type="submit" class="btn btn-primary">Search</button>
          </div>

          
    </section>

    <!-- Results summary + count -->
    <section class="results" aria-labelledby="results-heading">

      <!-- Cards grid (3-up on desktop) -->
      <ul class="card-grid" aria-label="Recipe results">
        <li>
          <article class="recipe-card">
            <a class="card__link" href="/recipe/lemon-chicken-pasta">
              <figure class="card__media">
                <img src="/assets/recipes/lemon-chicken-pasta.jpg" alt="Bowl of lemon chicken pasta with parsley" width="640" height="480" loading="lazy" />
              </figure>
              <div class="card__body">
                <h3 class="card__title">Weeknight Lemon Chicken Pasta</h3>
                <ul class="tags">
                  <li><a href="/s?q=tag%3Aquick">quick</a></li>
                  <li><a href="/s?q=tag%3Achicken">chicken</a></li>
                  <li><a href="/s?q=tag%3Apasta">pasta</a></li>
                </ul>
              </div>
            </a>
          </article>
        </li>

        <li>
          <article class="recipe-card">
            <a class="card__link" href="/recipe/chicken-broccoli-casserole">
              <figure class="card__media">
                <img src="/assets/recipes/chicken-broccoli-casserole.jpg" alt="Cheesy chicken broccoli casserole in a baking dish" width="640" height="480" loading="lazy" />
              </figure>
              <div class="card__body">
                <h3 class="card__title">Chicken Broccoli Casserole</h3>
                <ul class="tags">
                  <li><a href="/s?q=tag%3Acomfort">comfort</a></li>
                  <li><a href="/s?q=tag%3Acrowd">crowd</a></li>
                  <li><a href="/s?q=tag%3Afreezer">freezer</a></li>
                </ul>
              </div>
            </a>
          </article>
        </li>

        <li>
          <article class="recipe-card">
            <a class="card__link" href="/recipe/teriyaki-chicken-bowl">
              <figure class="card__media">
                <img src="/assets/recipes/teriyaki-chicken-bowl.jpg" alt="Teriyaki chicken bowl with rice and vegetables" width="640" height="480" loading="lazy" />
              </figure>
              <div class="card__body">
                <h3 class="card__title">Teriyaki Chicken Bowl</h3>
                <ul class="tags">
                  <li><a href="/s?q=tag%3Aquick">quick</a></li>
                  <li><a href="/s?q=tag%3Atakeout-at-home">takeout-at-home</a></li>
                  <li><a href="/s?q=tag%3Alunch">lunch</a></li>
                </ul>
              </div>
            </a>
          </article>
        </li>
      </ul>

      <!-- Empty state example (keep for reference; remove when templating) -->
      <!--
      <div class="empty" role="status">
        <p>No recipes found for “quinoa brownies”. Try fewer filters or a different search.</p>
        <p><a href="/cookbook">Browse all recipes</a></p>
      </div>
      -->
    </section>
  </main>
</body>
</html>
