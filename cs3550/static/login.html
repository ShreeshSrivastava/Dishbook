<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
 <header class="site-header" role="banner">
    <div class="site-header__inner">
      <a class="brand" href="/static/index.html">Dishbook</a>

      <div style="height: 2em;"></div>
      <a href="/static/profile.html" class="view-profile-link">Sign in</a>

      <nav class="site-nav" aria-label="Primary">
        <ul class="site-nav__links">
          <li><a href="/static/index.html" aria-current="page">Home</a></li>
        </ul>
        <form class="site-nav__search" role="search" action="/search" method="get">
          <input id="q" name="q" type="search" placeholder="" />
          <button type="submit">Search</button>
        </form>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <h2>Log in</h2>

    <form action="/login" method="post" aria-describedby="login-help">
      <!-- Add your CSRF token field here if needed -->
      <p id="login-help">Use your Dishbook account email and password.</p>

      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>

      <div>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <div>
        <input id="remember" name="remember" type="checkbox" value="1" />
        <label for="remember">Keep me signed in on this device</label>
      </div>

      <div>
        <button type="submit">Log in</button>
      </div>

      <p><a href="/forgot">Forgot your password?</a></p>
    </form>

    <section aria-labelledby="create-account">
      <h3 id="create-account">New to Dishbook?</h3>
      <p><a href="/register">Create an account</a> to save recipes, track variations, and follow cooks you like.</p>
    </section>
  </main>

  <footer>
    <small>© 2025 Dishbook · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></small>
  </footer>
</body>
</html>
